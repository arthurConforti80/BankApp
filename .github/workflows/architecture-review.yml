name: Architecture Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BankApp
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installs audit_core straight from the private MCP repository (master
      # branch) via pip. The git clone happens in pip's own temp folder,
      # outside the BankApp workspace, so it never gets picked up by
      # audit_core's recursive scan.
      - name: Install swift-arch-audit-mcp
        env:
          MCP_REPO_TOKEN: ${{ secrets.MCP_REPO_TOKEN }}
        run: pip install "git+https://x-access-token:${MCP_REPO_TOKEN}@github.com/arthurConforti80/MCP.git@master#subdirectory=swift-arch-audit-mcp"

      - name: Run architecture audit
        id: audit
        run: |
          set +e
          swift-arch-audit-cli --repo . --format markdown --fail-on error > audit-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Post result on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit-report.md', 'utf8');
            const marker = '<!-- swift-arch-audit -->';
            const commentBody = `${marker}\n${body}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Auto-approve PR (if clean)
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: '✅ swift-arch-audit: no architecture violations found.',
              });
            } catch (error) {
              core.warning(`Could not auto-approve: ${error.message}`);
            }

      - name: Fail the job on violations
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
