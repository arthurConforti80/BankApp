name: BankApp
options:
  bundleIdPrefix: com.arthurconforti
targets:
  BankApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - BankApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurconforti.BankApp
        TARGETED_DEVICE_FAMILY: "1,2"